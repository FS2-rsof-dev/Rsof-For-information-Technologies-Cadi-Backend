version: '3.8'

services:
  web:
    image: nginx:alpine
    container_name: cadi-backend-web
    ports:
      - "8081:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - sockdata:/sock
    depends_on:
      - php
    networks:
      - magento-network

  php:
    image: php:8.2-fpm
    container_name: cadi-backend-php
    volumes:
      - ./src:/var/www/html
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
      - sockdata:/sock
    working_dir: /var/www/html
    networks:
      - magento-network
    environment:
      - PHP_MEMORY_LIMIT=2G
    command: >
      bash -c "
      apt-get update &&
      apt-get install -y libicu-dev libxml2-dev libxslt-dev libzip-dev libfreetype6-dev libjpeg62-turbo-dev libpng-dev libonig-dev msmtp git unzip curl &&
      docker-php-ext-configure gd --with-freetype --with-jpeg &&
      docker-php-ext-install -j$$(nproc) intl xml xsl zip gd mbstring pdo pdo_mysql opcache soap bcmath ftp sockets &&
      pecl install redis &&
      docker-php-ext-enable redis &&
      curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer && chmod +x /usr/local/bin/composer &&
      echo 'memory_limit = 2G' > /usr/local/etc/php/conf.d/docker-php-memory-limit.ini &&
      mkdir -p /sock /var/www/html/var/cache /var/www/html/var/page_cache /var/www/html/var/session /var/www/html/var/tmp /var/www/html/generated &&
      chmod 777 /sock &&
      chown -R www-data:www-data /var/www/html/var /var/www/html/generated &&
      chmod -R 775 /var/www/html/var /var/www/html/generated &&
      (while true; do chown -R www-data:www-data /var/www/html/var /var/www/html/generated 2>/dev/null; chmod -R 775 /var/www/html/var /var/www/html/generated 2>/dev/null; sleep 30; done) &
      php-fpm -D &&
      tail -f /dev/null
      "

  db:
    image: mariadb:10.4
    container_name: cadi-backend-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: magento
      MYSQL_USER: magento
      MYSQL_PASSWORD: magento
    ports:
      - "3308:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - magento-network

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: cadi-backend-opensearch
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_SECURITY_PLUGIN=true"
    ports:
      - "9203:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - magento-network

  mailcatcher:
    image: schickling/mailcatcher
    container_name: cadi-backend-mailcatcher
    ports:
      - "1082:1080"
      - "1026:1025"
    networks:
      - magento-network

volumes:
  dbdata:
  opensearch-data:
  sockdata:

networks:
  magento-network:
    driver: bridge

